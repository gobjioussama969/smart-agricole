<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liste Affectations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Liste des Affectations</h3>
        <a th:href="@{/addAffectation}" class="btn btn-primary">Ajouter</a>
    </div>
    <div class="card"><div class="card-body table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="thead-light">
            <tr>
                <th>Id</th>
                <th>Utilisateur</th>
                <th>Parcelle</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${listeAffectations}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.utilisateur != null ? o.utilisateur.nom + ' ' + o.utilisateur.prenom : ''}"></td>
                <td th:text="${o.parcelle != null ? o.parcelle.nom : ''}"></td>
                <td>
                    <a th:href="@{/deleteAffectation/{id}(id=${o.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Supprimer cet element ?');">Supprimer</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listeAffectations)}">
                <td colspan="4" class="text-center text-muted">Aucun element</td>
            </tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>

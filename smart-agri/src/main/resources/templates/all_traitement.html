<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liste Traitements</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Liste des Traitements</h3>
        <a th:href="@{/addTraitement}" class="btn btn-primary">Ajouter</a>
    </div>
    <div class="card"><div class="card-body table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="thead-light">
            <tr>
                <th>Id</th>
                <th>Date</th>
                <th>Produit</th>
                <th>Cible</th>
                <th>Quantite</th>
                <th>Unite</th>
                <th>Methode</th>
                <th>Plantation</th>
                <th>Auteur</th>
                <th>Commentaire</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${listeTraitements}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.dateTraitement}"></td>
                <td th:text="${o.nomProduit}"></td>
                <td th:text="${o.cible}"></td>
                <td th:text="${o.quantite}"></td>
                <td th:text="${o.unite}"></td>
                <td th:text="${o.methodeApplication}"></td>
                <td th:text="${o.plantation != null ? 'Plantation #' + o.plantation.id : ''}"></td>
                <td th:text="${o.auteur != null ? o.auteur.nom + ' ' + o.auteur.prenom : ''}"></td>
                <td th:text="${o.commentaire}"></td>
                <td>
                    <a th:href="@{/deleteTraitement/{id}(id=${o.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Supprimer cet element ?');">Supprimer</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listeTraitements)}">
                <td colspan="11" class="text-center text-muted">Aucun element</td>
            </tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>

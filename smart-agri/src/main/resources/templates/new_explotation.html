<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajout Exploitation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">

    <h3>Ajout Exploitation</h3>
    <div class="card"><div class="card-body">
        <form th:action="@{/saveExploitation}" th:object="${ExploitationForm}" method="post" class="col-md-6">
            <div class="form-group">
                <label for="code">Code</label>
                <input type="text" class="form-control" id="code" th:field="*{code}" placeholder="code">
            </div>
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" placeholder="nom">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" class="form-control" id="description" th:field="*{description}" placeholder="description">
            </div>
            <div class="form-group">
                <label for="localisation">Localisation</label>
                <input type="text" class="form-control" id="localisation" th:field="*{localisation}" placeholder="localisation">
            </div>
            <div class="form-group">
                <label for="latitude">Latitude</label>
                <input type="number" step="any" class="form-control" id="latitude" th:field="*{latitude}" placeholder="latitude">
            </div>
            <div class="form-group">
                <label for="longitude">Longitude</label>
                <input type="number" step="any" class="form-control" id="longitude" th:field="*{longitude}" placeholder="longitude">
            </div>
            <div class="form-group">
                <label for="superficie">Superficie</label>
                <input type="number" step="any" class="form-control" id="superficie" th:field="*{superficie}" placeholder="superficie">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a th:href="@{/allExploitation}" class="btn btn-secondary">Annuler</a>
        </form>
    </div></div>
</div>
</body>
</html>

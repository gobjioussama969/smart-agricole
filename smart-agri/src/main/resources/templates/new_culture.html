<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajout Culture</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">

    <h3>Ajout Culture</h3>
    <div class="card"><div class="card-body">
        <form th:action="@{/saveCulture}" th:object="${CultureForm}" method="post" class="col-md-6">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" placeholder="nom">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" class="form-control" id="description" th:field="*{description}" placeholder="description">
            </div>
            <div class="form-group">
                <label for="type">Type</label>
                <input type="text" class="form-control" id="type" th:field="*{type}" placeholder="type">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a th:href="@{/allCulture}" class="btn btn-secondary">Annuler</a>
        </form>
    </div></div>
</div>
</body>
</html>

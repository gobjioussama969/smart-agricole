<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajout Traitement</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">

    <h3>Ajout Traitement</h3>
    <div class="card"><div class="card-body">
        <form th:action="@{/saveTraitement}" th:object="${TraitementForm}" method="post" class="col-md-6">
            <div class="form-group">
                <label for="dateTraitement">Date traitement</label>
                <input type="date" class="form-control" id="dateTraitement" th:field="*{dateTraitement}" placeholder="dateTraitement">
            </div>
            <div class="form-group">
                <label for="nomProduit">Nom produit</label>
                <input type="text" class="form-control" id="nomProduit" th:field="*{nomProduit}" placeholder="nomProduit">
            </div>
            <div class="form-group">
                <label for="cible">Cible</label>
                <input type="text" class="form-control" id="cible" th:field="*{cible}" placeholder="cible">
            </div>
            <div class="form-group">
                <label for="quantite">Quantite</label>
                <input type="number" step="any" class="form-control" id="quantite" th:field="*{quantite}" placeholder="quantite">
            </div>
            <div class="form-group">
                <label for="unite">Unite</label>
                <select class="form-control" id="unite" th:field="*{unite}">
                    <option th:each="o : ${uniteQuantites}" th:value="${o}" th:text="${o}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="methodeApplication">Methode application</label>
                <input type="text" class="form-control" id="methodeApplication" th:field="*{methodeApplication}" placeholder="methodeApplication">
            </div>
            <div class="form-group">
                <label for="commentaire">Commentaire</label>
                <input type="text" class="form-control" id="commentaire" th:field="*{commentaire}" placeholder="commentaire">
            </div>
            <div class="form-group">
                <label for="plantation">Plantation</label>
                <select class="form-control" id="plantation" th:field="*{plantation.id}" required>
                    <option th:each="o : ${listePlantations}" th:value="${o.id}" th:text="${'Plantation #' + o.id}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="auteur">Auteur</label>
                <select class="form-control" id="auteur" th:field="*{auteur.id}" required>
                    <option th:each="o : ${listeUtilisateurs}" th:value="${o.id}" th:text="${o.nom + ' ' + o.prenom}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a th:href="@{/allTraitement}" class="btn btn-secondary">Annuler</a>
        </form>
    </div></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajout Utilisateur</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">

    <h3>Ajout Utilisateur</h3>
    <div class="card"><div class="card-body">
        <form th:action="@{/saveUtilisateur}" th:object="${UtilisateurForm}" method="post" class="col-md-6">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" placeholder="nom">
            </div>
            <div class="form-group">
                <label for="prenom">Prenom</label>
                <input type="text" class="form-control" id="prenom" th:field="*{prenom}" placeholder="prenom">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="email">
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select class="form-control" id="role" th:field="*{role}">
                    <option th:each="o : ${roles}" th:value="${o}" th:text="${o}"></option>
                </select>
            </div>
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="actif" th:field="*{actif}">
                <label class="form-check-label" for="actif">Actif</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a th:href="@{/allUtilisateur}" class="btn btn-secondary">Annuler</a>
        </form>
    </div></div>
</div>
</body>
</html>

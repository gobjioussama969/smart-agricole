<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liste Variétés</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Liste des Variétés</h3>
        <a th:href="@{/addVariete}" class="btn btn-primary">Ajouter</a>
    </div>
    <div class="card"><div class="card-body table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="thead-light">
            <tr>
                <th>Id</th>
                <th>Nom</th>
                <th>Culture</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${listeVarietes}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.nom}"></td>
                <td th:text="${o.culture != null ? o.culture.nom : ''}"></td>
                <td th:text="${o.description}"></td>
                <td>
                    <a th:href="@{/deleteVariete/{id}(id=${o.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Supprimer cet element ?');">Supprimer</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listeVarietes)}">
                <td colspan="5" class="text-center text-muted">Aucun element</td>
            </tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>
